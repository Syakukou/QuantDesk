name: CI

# 推送 / PR 走离线检查（不联网，结果确定）；联网行情自检只在手动触发时跑。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      online_selftest:
        description: "同时跑联网自检（拉真实 A 股行情，依赖东财接口可用性，可能偶发失败）"
        type: boolean
        default: false

# 同一分支连续推送时，取消上一次未完成的运行，省额度也省等待
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline:
    name: 离线自检（语法 / 导入 / 回测内核 / 纯函数）
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 依赖版本快照
        run: pip list

      - name: 运行离线自检
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: python ci_check.py -v

  online:
    name: 联网行情自检
    if: github.event_name == 'workflow_dispatch' && inputs.online_selftest
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行联网自检
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: python main.py --selftest
